name: CI

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # stim has no cp315 Windows wheel yet (latest release 1.16.0), so it is
        # built from source, which fails with MSVC 14.52 (VS 2026+) shipped on
        # windows-latest since 2026-11-19. Build on windows-2022 (MSVC 14.44)
        # until stim publishes Python 3.15 wheels.
        exclude:
          - os: windows-latest
            python: "3.15"
        include:
          - os: windows-2022
            python: "3.15"

    name: "Python ${{ matrix.python }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all, necessary to find tags and branches
          fetch-tags: true

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Run nox
        run: uv run --extra dev nox -db uv --python ${{ matrix.python }}
